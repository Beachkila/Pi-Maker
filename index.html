<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Studio Wetware Pi-Maker</title>
<style>
:root{
  --bg:#ffffff;--panel:#ffffff;--line:rgba(0,0,0,.22);--rule:#000;--text:#000;--mut:#5c5c5c;--dot:rgba(0,0,0,.14);
  --accent:#000;--on-accent:#fff;
  --hw:#D85A30;--logic:#1D9E75;--data:#BA7517;--view:#7F77DD;--ok:#1D9E75;--bad:#C0392B;
  --t-num:#1D9E75;--t-bool:#7F77DD;--t-text:#BA7517;--t-any:#888780;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--gndc:#2F2F2F;
}
@media (prefers-color-scheme:dark){
  :root{--gndc:#C9C9C9;--bg:#000;--panel:#000;--line:rgba(255,255,255,.28);--rule:#fff;--text:#fff;--mut:#a8a8a8;--dot:rgba(255,255,255,.16);--accent:#fff;--on-accent:#000}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#top{display:flex;gap:8px;align-items:center;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
#projSel{flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;font-size:15px;font-weight:600}
.ib{width:38px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:18px;line-height:1}
.ib:disabled{color:var(--mut);cursor:default}
#vp{position:relative;flex:1;overflow:hidden;touch-action:none;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:24px 24px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#wires,#wtmp{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.wire{fill:none;stroke-width:2.5;stroke-linecap:round}
.wire.sel{stroke-width:5}
.whit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
.mline{fill:none;stroke:var(--mut);stroke-width:2;stroke-dasharray:6 6}
.tmp{fill:none;stroke-width:2.5;stroke-dasharray:4 4;stroke-linecap:round}
.node{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:12px;user-select:none;-webkit-user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.node.sel{outline:2px solid var(--text);outline-offset:1px}
.node.dim{opacity:.4}
.node.fitok{outline:2px solid var(--ok);outline-offset:1px}
.cat-hw{--cat:var(--hw)}.cat-logic{--cat:var(--logic)}.cat-in{--cat:var(--data)}.cat-view{--cat:var(--view)}
.nhead{height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);border-radius:9px 9px 0 0;background:color-mix(in srgb,var(--cat) 20%,var(--panel));cursor:grab}
.ntitle{font-weight:600;font-size:13px;white-space:nowrap}
.nsub{color:var(--mut);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nrows{display:block}
.row{position:relative;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:var(--mut);gap:6px}
.rl,.rr{display:flex;align-items:center;gap:5px;min-width:0}
.ov{font-family:var(--mono);font-size:11px;color:var(--text);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.port{position:absolute;top:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:var(--pc,#888);border:2px solid var(--panel);cursor:crosshair}
.port::after{content:"";position:absolute;inset:-11px}
.port.in{left:-7px}.port.out{right:-7px}
.port.cand{box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 40%,transparent)}
.port.near{box-shadow:0 0 0 4px var(--text)}
.dv{width:54px;height:20px;border:1px solid var(--line);border-radius:5px;background:var(--bg);padding:0 4px;font-size:11px}
.row.wired .dv{display:none}
.prow{display:flex;align-items:center;gap:4px}
.pon{width:auto;margin:0}
.pnm{width:68px;height:20px;border:1px solid var(--line);border-radius:5px;background:var(--bg);padding:0 4px;font-size:11px;font-family:var(--mono);color:var(--text)}
.pmd{width:84px;height:20px;font-size:11px;padding:0 2px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text)}
.row.poff .pnm,.row.poff .pmd,.row.poff .ov{opacity:.4}
.pcap{margin:6px 0 4px}
.ipanel{border:1px solid var(--rule);padding:10px;margin-bottom:12px}
.itab{width:100%;border-collapse:collapse;font-size:11px}
.itab th{text-align:left;font-weight:700;color:var(--mut);padding:2px 4px}
.itab td{padding:2px 4px}
.itab input[type=text],.itab input[type=number],.itab select{height:22px;font-size:11px;width:100%;box-sizing:border-box}
.itab select{min-width:92px}
.ipanel a{color:var(--text);text-decoration:none}

.nbody{padding:6px 10px 10px;display:flex;flex-direction:column;gap:6px}
.nbody:empty{display:none}
.nbody input[type=text],.nbody input[type=number],.nbody select,.nbody textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:4px 6px;font-size:12px}
.nbody textarea{font-family:var(--mono);resize:none;line-height:1.4}
.nbody input[type=range]{width:100%;margin:0}
.nbody .two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.nbody .lbl{font-size:11px;color:var(--mut)}
.big{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--text);word-break:break-word}
.err{color:var(--bad);font-size:11px;padding:0 10px 8px;font-family:var(--mono);white-space:pre-wrap}
.err:empty{display:none}
.btn{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 10px;font-size:13px}
.btn.pri{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.on{background:var(--text);color:var(--bg)}
.cstrip{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.cchip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--cc);border-radius:6px;padding:1px 7px;font-size:11px;line-height:1.5;background:var(--bg);color:var(--text);white-space:nowrap}
.cs{display:inline-block;width:9px;height:9px;background:var(--cc);flex:none}
.cs.dot{border-radius:50%}.cs.ring{border-radius:50%;background:transparent;border:2.5px solid var(--cc)}
.cs.dia{transform:rotate(45deg) scale(.82)}.cs.tri{clip-path:polygon(50% 0,100% 100%,0 100%)}
.cs.hex{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.cs.bar{width:15px;height:5px;border-radius:2px}.cs.usb{width:11px;height:8px;border-radius:2px 2px 5px 5px}
.cs.hat{width:15px;height:7px;background:repeating-linear-gradient(90deg,var(--cc) 0 2px,transparent 2px 4px)}
.krow{display:flex;gap:10px;align-items:center;margin:7px 0}.kdesc{font-size:12px;color:var(--mut)}
.bbrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:6px 0;background:var(--bg)}
.bbname{font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.bbsig{display:inline-flex;align-items:center;gap:4px}.bbg{font-size:11px;color:var(--mut)}.bbn{width:54px;height:26px;padding:0 4px}
.bbdraw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#faf8f3}.bbdraw svg{display:block;max-width:none}
.wtr{display:flex;gap:8px;align-items:center;margin:4px 0;font-size:12px;flex-wrap:wrap}.wtt{font-family:var(--mono);font-size:11px}
.chipx{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;background:var(--bg)}
.sw{width:9px;height:9px;border-radius:50%;display:inline-block}
.msg-ok{color:var(--ok)}.msg-bad{color:var(--bad)}
#mini{position:absolute;top:8px;right:8px;width:96px;height:64px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--panel) 88%,transparent);z-index:3}
#bar{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);z-index:5}
#hint{flex:1;min-width:0;font-size:11px;color:var(--mut);line-height:1.3}
#selbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom));display:none;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#selbar.show{display:flex}
#back{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
#back.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:760px;max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;transform:translateY(108%);transition:transform .2s;z-index:30}
#sheet.open{transform:none}
#shHead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
#shBody{min-height:0;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sec{font-size:12px;color:var(--mut);margin:16px 0 8px}
.sec:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 10px;border-left:4px solid var(--cat,var(--line))}
.tile b{display:block;font-size:13px}
.tile span{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.dcv{width:100%;height:auto;display:block;image-rendering:pixelated;border:1px solid var(--line);border-radius:4px;background:#fff;touch-action:none}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f2{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;align-items:center;margin:8px 0}
.f2 label{font-size:12px;color:var(--mut)}
.f2 input[type=text],.f2 input[type=number],.f2 select{width:100%;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 8px;font-size:14px}
.f2 input[type=color]{width:44px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
pre.code{font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0 0;user-select:text;-webkit-user-select:text}
.note{font-size:12px;color:var(--mut);margin:8px 0 0;line-height:1.45}
.pins{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:11px}
.pin{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;padding:3px 6px;min-height:34px;background:var(--bg)}
.pin small{color:var(--mut);font-size:10px}
.pin.pw{background:color-mix(in srgb,var(--hw) 14%,var(--bg))}
.pin.gd{background:color-mix(in srgb,var(--mut) 20%,var(--bg))}
.pin.cl{color:#fff;border-color:transparent}
.pin.cl small{color:#fff}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:88vw;text-align:center}
#toast.show{opacity:1}
.item{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0;font-size:13px;line-height:1.4}
.item .t b{display:block;font-size:14px;font-weight:600}
.item .t span{display:block;color:var(--mut);font-size:12px;margin-top:2px;line-height:1.4}
.bdg{font-size:11px;padding:2px 7px;border-radius:6px;white-space:nowrap;border:1px solid var(--line);color:var(--mut)}
.bdg.ok{color:var(--ok);border-color:var(--ok)}
.bdg.me{color:var(--data);border-color:var(--data)}
.bdg.sg{color:var(--view);border-color:var(--view)}
.crow{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;margin:0 0 8px}
.crow b{display:block;font-size:14px}
.crow span{display:block;font-size:12px;color:var(--mut);margin-top:2px;line-height:1.4}
.crow span.msg-ok{color:var(--ok)}.crow span.msg-bad{color:var(--bad)}
.dprev{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:4px;image-rendering:pixelated;background:#fff;margin:2px 0 6px;cursor:pointer}
#main{flex:1;display:flex;min-height:0;position:relative}
#vp{min-width:0}
#con{display:none;flex-direction:column;width:460px;max-width:100%;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
#con.open{display:flex}
#conHead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
#conBody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#conTabs{padding:0 12px 8px;max-height:42%;overflow:auto;border-bottom:1px solid var(--line)}
#conPane{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 12px;overflow:hidden}
#conPane pre.code{flex:1;min-height:0;overflow:auto;margin:0}
@media (max-width:820px){#con{position:absolute;right:0;top:0;bottom:0;width:min(100%,460px);z-index:40;box-shadow:-4px 0 16px rgba(0,0,0,.18)}}
select.sm{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;font-size:14px}

/* ---- Studio Wetware skin: black and white, one accent variable ---- */
:root{--r:2px}
body{font-size:14px}
input,select,textarea{accent-color:var(--accent)}
#top{height:44px;padding:0 0 0 12px;padding-top:env(safe-area-inset-top);gap:6px;border-bottom:1px solid var(--rule);box-sizing:content-box}
.brand{font-weight:800;letter-spacing:.18em;font-size:12px;text-transform:uppercase;white-space:nowrap;margin-right:8px;user-select:none;cursor:pointer;background:none;border:0;padding:0;color:var(--text)}
.brand small{font-weight:500;letter-spacing:.06em;color:var(--mut);margin-left:8px;text-transform:none;font-size:11px}
#menus{display:flex;align-self:stretch}
.mb{background:none;border:0;border-radius:0;padding:0 11px;font-size:13px;color:var(--text)}
.mb:hover,.mb.on{background:var(--accent);color:var(--on-accent)}
#projSel{flex:0 1 210px;height:30px;border-radius:var(--r);background:var(--panel);border:1px solid var(--rule);font-size:13px;font-weight:600;margin-left:6px}
#topsp{flex:1}
#top .ib{height:44px;width:40px;border:0;border-left:1px solid var(--line);border-radius:0;background:none}
#top .ib:hover:not(:disabled){background:var(--accent);color:var(--on-accent)}
#top .ib.on{background:var(--accent);color:var(--on-accent)}
#btnHam{display:none;font-size:20px;border-left:0!important}
#btnPlus{display:none;font-size:24px;font-weight:300}
.hgb{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 16px;border:0;border-bottom:1px solid var(--line);background:none;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--text);text-align:left;border-radius:0}
.hgb.on{background:var(--accent);color:var(--on-accent)}
.hgi{display:none;border-bottom:1px solid var(--rule)}
.hgi.open{display:block}
.btn,.ib,select.sm,.crow,.tile,.pin,pre.code,.dv,.bdg{border-radius:var(--r)}
.btn{background:var(--panel);border-color:var(--rule)}
.btn.sm{border-color:var(--line)}
.btn:hover{background:color-mix(in srgb,var(--text) 8%,var(--panel))}
.btn.pri,.btn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.node{border-radius:4px;box-shadow:none;border-color:var(--rule)}
.node.sel{outline:2px solid var(--accent)}
.nhead{border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--cat) 13%,var(--panel));border-bottom-color:var(--rule)}
.ntitle{letter-spacing:.01em}
#sheet{border-radius:0;border-color:var(--rule);box-shadow:0 -6px 0 rgba(0,0,0,.08)}
#shHead{border-bottom-color:var(--rule)}
#shTitle{text-transform:uppercase;letter-spacing:.14em;font-size:12px}
.sec{text-transform:uppercase;letter-spacing:.12em;font-size:11px}
#selbar{border-radius:var(--r);border-color:var(--rule);box-shadow:3px 3px 0 rgba(0,0,0,.18);bottom:16px;left:calc((100% - var(--conw,30px))/2);transform:translateX(-50%)}
#toast{bottom:calc(24px + env(safe-area-inset-bottom));border-radius:var(--r)}
#main{--cw:460px;--conw:30px}
#hint{position:absolute;left:12px;bottom:10px;pointer-events:none;max-width:60%;z-index:1}
#dd{position:fixed;z-index:25;min-width:250px;max-width:92vw;background:var(--panel);border:1px solid var(--rule);box-shadow:4px 4px 0 rgba(0,0,0,.16);padding:4px 0;display:none}
#dd.open{display:block}
.ddi{display:flex;justify-content:space-between;gap:24px;width:100%;padding:8px 16px;border:0;background:none;text-align:left;font-size:13px;color:var(--text);border-radius:0}
.ddi:hover:not(:disabled){background:var(--accent);color:var(--on-accent)}
.ddi:disabled{opacity:.38;cursor:default}
.ddi i{font-style:normal;color:var(--mut);font-size:11px;font-family:var(--mono)}
.ddi:hover:not(:disabled) i{color:inherit}
.dds{height:1px;background:var(--line);margin:4px 0}
#hamBack{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:34;display:none}
#ham{position:fixed;left:0;top:0;bottom:0;width:min(88vw,340px);background:var(--panel);border-right:1px solid var(--rule);z-index:35;overflow:auto;transform:translateX(-102%);transition:transform .18s;padding-bottom:env(safe-area-inset-bottom)}
#ham.open{transform:none}
#hamBack.open{display:block}
#ham .hh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--rule)}
#ham .hg{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:14px 16px 4px}
#ham .ddi{padding:10px 16px;font-size:14px}
/* console: docked right sidebar */
#con{position:relative;display:flex;flex-direction:row;flex:none;width:var(--conw,30px);max-width:none;min-height:0;border-left:1px solid var(--rule);background:var(--panel)}
#con.open{width:var(--cw)}
#conRail{width:29px;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:10px;background:none;border:0;color:var(--text);cursor:pointer}
#conRail:hover{background:var(--accent);color:var(--on-accent)}
#conRail span{writing-mode:vertical-rl;letter-spacing:.2em;font-size:11px;font-weight:700;text-transform:uppercase}
#conRail b{font-family:var(--mono);font-size:13px}
#conPanel{display:none;flex:1;min-width:0;flex-direction:column;min-height:0}
#con.open #conPanel{display:flex}
#con.open #conRail{display:none}
#conGrip{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:3;touch-action:none}
#conGrip:hover,#conGrip.drag{background:var(--accent);opacity:.5}
#con:not(.open) #conGrip{display:none}
#conHead{border-bottom-color:var(--rule);padding:0 0 0 12px;height:36px}
#conHead b{text-transform:uppercase;letter-spacing:.14em;font-size:11px}
#conClose{border:0;border-left:1px solid var(--line);height:36px;border-radius:0;padding:0 12px}
body.cdrag{user-select:none;cursor:col-resize}
@media (max-width:900px){
  .brand,#menus{display:none}
  #btnHam,#btnPlus{display:block}
  #top{padding-left:0}
  #projSel{flex:1;margin-left:8px;margin-right:6px}
  #topsp{display:none}
  #con{position:absolute;right:0;top:0;bottom:0;width:100%!important;z-index:40;transform:translateX(100%);visibility:hidden;transition:transform .18s,visibility 0s .18s;border-left:0;box-shadow:none}
  #con.open{transform:none;visibility:visible;transition:transform .18s}
  #conRail,#conGrip{display:none!important}
  #selbar{left:50%}
  #hint{display:none}
  .ddi i{display:none}
}

h.dirname(path)", "    if folder:", "        os.makedirs(folder, exist_ok=True)", "    make_frame().save(path)", "    print('[mock camera] saved', path)", "", "", "class H264Encoder:", "    def __init__(self, bitrate=None, *args, **kwargs):", "        self.bitrate = bitrate", "", "", "class Picamera2:", "    \"\"\"Same method names as the real picamera2 library. Only what this project uses.\"\"\"", "", "    def __init__(self, camera_num=0, *args, **kwargs):", "        self.camera_num = camera_num", "        self.started = False", "        self._output = None", "", "    def create_still_configuration(self, *args, **kwargs):", "        return {}", "", "    def create_preview_configuration(self, *args, **kwargs):", "        return {}", "", "    def create_video_configuration(self, *args, **kwargs):", "        return {}", "", "    def configure(self, config=None):", "        pass", "", "    def start(self, *args, **kwargs):", "        self.started = True", "", "    def stop(self):", "        self.started = False", "", "    def close(self):", "        self.started = False", "", "    def capture_file(self, name, *args, **kwargs):", "        _save(name)", "", "    def start_and_capture_file(self, name='test.jpg', *args, **kwargs):", "        self.start()", "        _save(name)", "", "    def capture_image(self, name='main'):", "        return make_frame()", "", "    def capture_array(self, name='main'):", "        import numpy", "        return numpy.asarray(make_frame())", "", "    def start_recording(self, encoder, output, *args, **kwargs):", "        self._output = output", "        with open(output, 'wb') as f:", "            f.write(b'MOCK VIDEO - not a real recording\\n')", "        print('[mock camera] recording to', output)", "", "    def stop_recording(self):", "        print('[mock camera] stopped recording', self._output)", "        self._output = None", "", "", "def _install_camera():", "    picam = types.ModuleType('picamera2')", "    picam.Picamera2 = Picamera2", "    enc = types.ModuleType('picamera2.encoders')", "    enc.H264Encoder = H264Encoder", "    picam.encoders = enc", "    sys.modules['picamera2'] = picam", "    sys.modules['picamera2.encoders'] = enc", "", "    real_run = subprocess.run", "", "    def run(args, *a, **kw):", "        if isinstance(args, (list, tuple)) and args and args[0] == 'fswebcam':", "            _save(str(args[-1]))", "            return subprocess.CompletedProcess(args, 0)", "        return real_run(args, *a, **kw)", "", "    subprocess.run = run", "", "", "HELP = \"\"\"", "[mock] Pretend buttons. Type a GPIO number and press Enter to press it.", "       hold 17        hold GPIO 17 down for 1.5 seconds", "       hold 17 3.2    hold it for 3.2 seconds", "       pins           list the pins this project uses", "       q              quit\"\"\"", "", "", "def _pins():", "    from gpiozero import Device", "    return Device.pin_factory", "", "", "def _press(num, secs=0.15):", "    pin = _pins().pin(num)", "    active_low = pin.pull == 'up'", "    (pin.drive_low if active_low else pin.drive_high)()", "    time.sleep(secs)", "    (pin.drive_high if active_low else pin.drive_low)()", "", "", "def _console():", "    time.sleep(1.0)", "    print(HELP)", "    for line in sys.stdin:", "        w = line.split()", "        if not w:", "            continue", "        try:", "            if w[0] == 'q':", "                os._exit(0)", "            elif w[0] == 'pins':", "                print('[mock] pins in use:', sorted(p for p in _pins().pins if isinstance(p, int)) or 'none yet')", "            elif w[0] == 'hold':", "                _press(int(w[1]), float(w[2]) if len(w) > 2 else 1.5)", "            else:", "                _press(int(w[0]))", "        except Exception as e:", "            print('[mock] could not do that:', e)", "", "", "if ACTIVE:", "    os.environ.setdefault('GPIOZERO_PIN_FACTORY', 'mock')", "    _install_camera()", "    print('[mock] ON: fake camera and fake buttons. Nothing function holdWait(n,need,go){
  var t0=n.rt.t0;
  function chk(){
    if(!n.rt.prev||n.rt.t0!==t0||n.rt.done)return;
    var left=need-(simNow()-t0);
    if(left<=0){n.rt.done=true;go();return}
    setTimeout(chk,Math.max(30,Math.min(300,left/Math.max(SIM.k,0.05))));
  }
  setTimeout(chk,30);

function simFire(n){
  var tg0=actionTarget(n);if(tg0&&tg0.a.id!=='photo')return simOther(n,tg0);
  var tg=tg0;if(!tg||!/^p_(cam|hq|usbcam)/.test(tg.own.type))return;
  var hn=NM[n.props.host];if(!hn)return;
  MOCKSHOT[hn.id]=(MOCKSHOT[hn.id]||0)+1;n.rt.mock=MOCKSHOT[hn.id];

function simOther(n,tg){
  var id=tg.a.id,own=tg.own,hn=NM[n.props.host];if(!hn)return;
  var lib=libFor(hn),m=lib&&(lib.props.sim=lib.props.sim||{count:0,index:0});
  if(m){m.count=Number(m.count)||0;m.index=Number(m.index)||0}
  if(own.type==='photolib'&&m){
    if(id==='next'&&m.count)m.index=m.index%m.count+1;
    else if(id==='prev'&&m.count)m.index=(m.index-2+m.count)%m.count+1;
    else if(id==='newest')m.index=m.count;

function openBoard(bb){

      box.innerHTML='';

      box.appendChild(h('div',{class:'note',text:'Parts that are not HATs (sensors, buttons, small screens) are wired onto this board automatically. The drawing is a simplified schematic: pin order on real modules varies, so match each wire by its pin label. Power the Pi off before wiring.'}));
      if(pl.warn.length){pl.warn.forEach(function(w){box.appendChild(h('div',{class:'lbl msg-bad',style:'margin:6px 0',text:w}))})}
      /* part list with switches and GPIO edits */
      box.appendChild(h('div',{class:'sec',text:'Parts on this Pi'}));
      var cand=mountedOn(pl.host.id).filter(function(p){return BB_OK[p.type]});
      if(!cand.length)box.appendChild(h('div',{class:'note',text:'None yet. Add a sensor, button or small screen and mount it on this Pi.'}));
      cand.forEach(function(p){

        row.appendChild(h('label',{class:'bbname'},[cb,' '+A.title+' #'+p.id]));

              inpn.addEventListener('change',function(){var v=parseInt(inpn.value,10);if(!(v>=2&&v<=27)){inpn.value=s.g;return}p.props.pins=p.props.pins||{};p.props.pins[s.r]=v;if(p.props.pinsAuto)delete p.props.pinsAuto[s.r];touch(p);commitNow();drawWires();draw()});

      /* table */

      if(!pl.table.length||!pl.parts.length)box.appendChild(h('div',{class:'note',text:'Nothing to wire yet.'}));
      else pl.table.forEach(function(r){box.appendChild(h('div',{class:'wtr'},[connChip(r.conn),h('span',{class:'wtt',text:r.from+'  ->  '+r.to+(r.note?'  ('+r.note+')':'')})]))});

      box.appendChild(h('div',{class:'sec',text:'What you need for the board'}));

        h('button',{class:'btn',text:'Download wiring.txt',onclick:function(){download('wiring.txt',txt+'\n','text/plain')}}),
        h('button',{class:'btn',text:'Key',onclick:openKey})]));
    }
    draw();
  });
}

function mountKind(n){
  var A=ADDONS[n.type];
  if(n.type==='p_bb')return'Solderless breadboard';
  if(A.mount)return A.mount;
  if(IS_HAT[n.type])return'Sits on the 40-pin header';
  var bb=bbFor(n);if(bb)return'Wired on the breadboard (see the wiring table)';
  var f=A.ifaces||[];
  if(f.indexOf('CSI')>=0)return'Camera ribbon cable';
  if(f.indexOf('DSI')>=0)return'Display ribbon cable';
  if(f.indexOf('USB')>=0)return'USB port';
  return'Wired to the header pins';
}

/* ---------- safe svg ---------- */
var SVGNS='http://www.w3.org/2000/svg';
var OKT={g:1,path:1,circle:1,ellipse:1,rect:1,line:1,polyline:1,polygon:1,text:1,tspan:1};
var OKA=/^(x|y|x1|x2|y1|y2|cx|cy|r|rx|ry|d|points|width|height|fill|stroke|stroke-width|stroke-linecap|stroke-linejoin|stroke-dasharray|opacity|fill-opacity|stroke-opacity|transform|font-size|text-anchor|font-family|font-weight|dx|dy)$/;
function cleanSvg(str){
  var doc=new DOMParser().parseFromString('<svg xmlns="'+SVGNS+'">'+str+'</svg>','image/svg+xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('Invalid SVG');
  var holder=document.createElementNS(SVGNS,'g');
  (function walk(src,dst){
    Array.prototype.forEach.call(src.childNodes,function(c){
      if(c.nodeType===3){dst.appendChild(document.createTextNode(c.nodeValue));return}
      if(c.nodeType!==1||!OKT[c.localName])return;

      walk(c,e);dst.appendChild(e);

}

function delProject(){

  if(!S.projects.length){var p=hydrate({id:'p'+Date.now().toString(36),name:'Untitled',nodes:[],wires:[],seq:1});S.projects.push(p)}

function setupLines(items){
  var ifs=[],apt=[],pip=[],git=[],man=[],cfg=[],out=[],blinka=false,pi5=false,esp=false,any=false;
  function add(a,v){if(v&&a.indexOf(v)<0)a.push(v)}
  items.forEach(function(it){
    if(!HOSTS[it.host]||!HOSTS[it.host].pi){esp=true;return}
    any=true;if(HOSTS[it.host].gpiod)pi5=true;
    (it.A.cfg||[]).forEach(function(c){add(cfg,c)});
    (it.A.ifaces||[]).forEach(function(f){(IFACE_CMD[f]||[]).forEach(function(c){add(ifs,c)})});
    (it.A.libs||[]).forEach(function(l){
      if(!it.on(l))return;
      if(l.blinka)blinka=true;
      if(l.pm==='apt')String(l.pkg).split(' ').forEach(function(p){add(apt,p)});
      else if(l.pm==='pip')add(pip,l.pkg);
      else if(l.pm==='git')add(git,l.pkg);
      else if(l.pm==='manual')(l.lines||[]).forEach(function(x){add(man,x)});
    });
  });
  if(esp&&!any)return ['# Add-ons on this board are wired to free GPIO and run as firmware. Nothing to install on a Pi.'];
  if(pi5&&blinka){add(apt,'python3-rpi-lgpio')}
  ifs.forEach(function(c){out.push(c)});
  if(apt.length){out.push('sudo apt update');out.push('sudo apt install -y '+apt.join(' '))}
  if(pi5&&blinka)out.push('# Pi 5: if RPi.GPIO is installed, remove it first (sudo apt remove -y python3-rpi.gpio). python3-rpi-lgpio replaces it');
  if(pip.length){
    out.push('python3 -m venv --system-site-packages ~/sandbox-env');
    out.push('source ~/sandbox-env/bin/activate');
    out.push('pip install '+pip.join(' '));
  }
  git.forEach(function(u){out.push('git clone '+u)});
  man.forEach(function(x){out.push(x)});
  cfg.forEach(function(c){out.push("grep -qxF '"+c+"' /boot/firmware/config.txt || echo '"+c+"' | sudo tee -a /boot/firmware/config.txt")});
  if(cfg.length)out.push('# Reboot once so the new config.txt lines take effect: sudo reboot');

  return out;
}

    var fname='act_'+n.id;

    var outName=((TY[s.type].outs[w.from.p]||{}).n||'').toLowerCase(),A=ADDONS[s.type],mode=n.props.mode||'press';
    var cls=A?claimsOf(s):[],cl=cls.filter(function(x){return x.r.toLowerCase()===outName})[0];
    var key,ctor,kind,ev;
    if(s.type==='p_pir'){cl=cls[0];kind='pir';key='pir_'+s.id;ctor=key+' = MotionSensor('+cl.g+')';add(btnImp,'MotionSensor');ev=mode==='release'?'when_no_motion':'when_motion'}

/* after a press or release, look again when its "just now" window ends, and when a long press is reached */
function padLater(l,k){
  var c=inpOf(l).ctl[k],ms=[PAD_WIN+25];if(c.mode==='long')ms.push(c.hold*1000+25);
  ms.forEach(function(t){setTimeout(function(){refresh();pushIn(l)},t)});
}
function padSet(l,k,down,bt){
  if(down&&SIM.off)return;
  var e=SIM.eng&&SIM.eng[l.id],quiet=!!(e&&e.state==='running');   /* a running game would flood the log */
  l.rt.k=l.rt.k||{};l.rt.kt=l.rt.kt||{};l.rt.kr=l.rt.kr||{};
  if(down){
    if(l.rt.k[k])return;
    l.rt.k[k]=true;l.rt.kt[k]=performance.now();if(bt)bt.classList.add('on');refresh();padLater(l,k);
    if(!quiet)runLog(ADDONS[l.type].short+' '+k+' pressed');
  }else{
    if(bt)bt.classList.remove('on');
    if(!l.rt.k[k])return;
    var held=performance.now()-(l.rt.kt[k]||0);
    if(held<120){   /* a real key is down for tens of ms; a click can be shorter than the program polls, so hold it a moment */
      setTimeout(function(){padSet(l,k,false,bt)},120-held+1);return;
    }
    l.rt.k[k]=false;l.rt.kr[k]=performance.now();refresh();padLater(l,k);
    if(!quiet)runLog(ADDONS[l.type].short+' '+k+' released');
  }
  pushIn(l);
}

/* keyboard: arrows or WASD for the stick, Enter presses it, 1 2 3 are the keys (Space is KEY1) */
var PADKEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',Enter:'press',' ':'key1','1':'key1','2':'key2','3':'key3'};
var KEYHELD={};
function padKey(e,down){

  var st=SIM.scr.filter(function(x){return hasPad(x.n.type)})[0];if(!st)return;
  e.preventDefault();if(e.repeat)return;

function runDraw(st,first){
  var n=st.n,rf=rfOf(n),ctx=st.ctx;
  paintDisplay(ctx,n,[],null);
  var sig=st.cv.toDataURL();
  if(!first&&st.last===sig){
    if(rf.skip&&isEink(n.type)){st.skipped++;st.stat.textContent='Unchanged, skipped ('+st.skipped+' skipped so far)';return}
    if(!isEink(n.type)){st.upd++;st.stat.textContent='Redraw #'+st.upd+' (nothing changed)';return}
  }
  st.last=sig;st.upd++;
  var mono=dcfg(n).mono,inv=mono&&invOf(n),kind='redraw';
  if(isEink(n.type)){kind=(rf.mode==='full'||st.upd===1||(rf.fullEvery&&st.upd%rf.fullEvery===0))?'full':'partial'}
  var txt=(isEink(n.type)?(kind==='full'?'Full refresh':'Partial refresh'):'Redraw')+' #'+st.upd+(mono?(inv?', inverted':', normal'):'');
  st.stat.textContent=txt;
  if(kind==='full'){st.cv.classList.remove('flash');void st.cv.offsetWidth;st.cv.classList.add('flash')}
  if(!first)runLog(st.title+': '+txt);

function runTick(){
  if(!SIM.on)return;
  if(!CON.open||CON.mode!=='run'){return}
  var sg=runSig();if(sg!==SIM.sig){buildRun();return}
  var t=simNow();
  refresh();
  if(SIM.off){SIM.scr.forEach(function(st){st.next=t});return}
  SIM.scr.forEach(function(st){
    if(st.custom){var e=SIM.eng[st.n.id];if(e&&e.state==='running'){var j=inputsFor(st.n);if(j!==e.last){e.last=j;e.w.postMessage({type:'inputs',json:j})}}return}
    if(t>=st.next){st.next=t+rf1(st.n)*1000;runDraw(st,false)}
  });
  Object.keys(SIM.acts).forEach(function(id){
    var a=NM[id];if(!a)return;var f=a.rt.fired||0;
    if(f!==SIM.acts[id]){SIM.acts[id]=f;var tg=actionTarget(a);runLog('Action fired: '+(tg?tg.a.label:'#'+id)+' (x'+f+')')}
  });
  if(SIM.libEl){var hn=runHost(),lb=hn&&libFor(hn),m=lb&&lb.props.sim;SIM.libEl.textContent=m?('Photos: '+m.count+', showing #'+m.index):''}
  var el=Math.max(0,(t-SIM.start)/1000);if(SIM.clk)SIM.clk.textContent=p2(Math.floor(el/60))+':'+p2(Math.floor(el%60));
}

function inputsCard(n){
  var I=inpOf(n),card=h('div',{class:'ipanel'}),host=hostOf(n);
  card.appendChild(h('div',{class:'sec',style:'margin:0 0 6px',text:ADDONS[n.type].title+' #'+n.id+(host?' on '+HOSTS[host.type].short+' #'+host.id:'')}));
  var t=h('table',{class:'itab'}),hr=h('tr');
  ['control','use','name','turns on','hold s','debounce ms','invert'].forEach(function(x){hr.appendChild(h('th',{text:x}))});
  t.appendChild(hr);
  PAD_IDS.forEach(function(id){
    var c=I.ctl[id],act=padTaken(n,id),tr=h('tr'),td=function(el){var d=h('td');if(el)d.appendChild(el);tr.appendChild(d)};
    td(h('span',{text:id}));
    var on=h('input',{type:'checkbox'});on.checked=c.on;on.addEventListener('change',function(){inpSet(n,id,'on',on.checked);touch(n)});td(on);

}
function renderInputs(force){
