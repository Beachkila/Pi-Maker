<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Makers sandbox</title>
<style>
:root{
  --bg:#f4f3ef;--panel:#ffffff;--line:rgba(0,0,0,.16);--text:#1f1f1d;--mut:#6b6a64;--dot:rgba(0,0,0,.12);
  --hw:#D85A30;--logic:#1D9E75;--data:#BA7517;--view:#7F77DD;--ok:#1D9E75;--bad:#C0392B;
  --t-num:#1D9E75;--t-bool:#7F77DD;--t-text:#BA7517;--t-any:#888780;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1a1a18;--panel:#262624;--line:rgba(255,255,255,.18);--text:#ecebe5;--mut:#a3a199;--dot:rgba(255,255,255,.1)}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#top{display:flex;gap:8px;align-items:center;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
#projSel{flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;font-size:15px;font-weight:600}
.ib{width:38px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:18px;line-height:1}
.ib:disabled{color:var(--mut);cursor:default}
#vp{position:relative;flex:1;overflow:hidden;touch-action:none;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:24px 24px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#wires,#wtmp{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.wire{fill:none;stroke-width:2.5;stroke-linecap:round}
.wire.sel{stroke-width:5}
.whit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
.mline{fill:none;stroke:var(--mut);stroke-width:2;stroke-dasharray:6 6}
.tmp{fill:none;stroke-width:2.5;stroke-dasharray:4 4;stroke-linecap:round}
.node{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:12px;user-select:none;-webkit-user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.node.sel{outline:2px solid var(--text);outline-offset:1px}
.node.dim{opacity:.4}
.node.fitok{outline:2px solid var(--ok);outline-offset:1px}
.cat-hw{--cat:var(--hw)}.cat-logic{--cat:var(--logic)}.cat-in{--cat:var(--data)}.cat-view{--cat:var(--view)}
.nhead{height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);border-radius:9px 9px 0 0;background:color-mix(in srgb,var(--cat) 20%,var(--panel));cursor:grab}
.ntitle{font-weight:600;font-size:13px;white-space:nowrap}
.nsub{color:var(--mut);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nrows{display:block}
.row{position:relative;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:var(--mut);gap:6px}
.rl,.rr{display:flex;align-items:center;gap:5px;min-width:0}
.ov{font-family:var(--mono);font-size:11px;color:var(--text);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.port{position:absolute;top:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:var(--pc,#888);border:2px solid var(--panel);cursor:crosshair}
.port::after{content:"";position:absolute;inset:-11px}
.port.in{left:-7px}.port.out{right:-7px}
.port.cand{box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 40%,transparent)}
.port.near{box-shadow:0 0 0 4px var(--text)}
.dv{width:54px;height:20px;border:1px solid var(--line);border-radius:5px;background:var(--bg);padding:0 4px;font-size:11px}
.row.wired .dv{display:none}
.nbody{padding:6px 10px 10px;display:flex;flex-direction:column;gap:6px}
.nbody:empty{display:none}
.nbody input[type=text],.nbody input[type=number],.nbody select,.nbody textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:4px 6px;font-size:12px}
.nbody textarea{font-family:var(--mono);resize:none;line-height:1.4}
.nbody input[type=range]{width:100%;margin:0}
.nbody .two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.nbody .lbl{font-size:11px;color:var(--mut)}
.big{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--text);word-break:break-word}
.err{color:var(--bad);font-size:11px;padding:0 10px 8px;font-family:var(--mono);white-space:pre-wrap}
.err:empty{display:none}
.btn{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 10px;font-size:13px}
.btn.pri{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.on{background:var(--text);color:var(--bg)}
.chipx{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;background:var(--bg)}
.sw{width:9px;height:9px;border-radius:50%;display:inline-block}
.msg-ok{color:var(--ok)}.msg-bad{color:var(--bad)}
#mini{position:absolute;top:8px;right:8px;width:96px;height:64px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--panel) 88%,transparent);z-index:3}
#bar{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);z-index:5}
#hint{flex:1;min-width:0;font-size:11px;color:var(--mut);line-height:1.3}
#selbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom));display:none;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#selbar.show{display:flex}
#back{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
#back.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:760px;max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;transform:translateY(108%);transition:transform .2s;z-index:30}
#sheet.open{transform:none}
#shHead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
#shBody{min-height:0;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sec{font-size:12px;color:var(--mut);margin:16px 0 8px}
.sec:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 10px;border-left:4px solid var(--cat,var(--line))}
.tile b{display:block;font-size:13px}
.tile span{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.dcv{width:100%;height:auto;display:block;image-rendering:pixelated;border:1px solid var(--line);border-radius:4px;background:#fff;touch-action:none}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f2{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;align-items:center;margin:8px 0}
.f2 label{font-size:12px;color:var(--mut)}
.f2 input[type=text],.f2 input[type=number],.f2 select{width:100%;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 8px;font-size:14px}
.f2 input[type=color]{width:44px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
pre.code{font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0 0;user-select:text;-webkit-user-select:text}
.note{font-size:12px;color:var(--mut);margin:8px 0 0;line-height:1.45}
.pins{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:11px}
.pin{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;padding:3px 6px;min-height:34px;background:var(--bg)}
.pin small{color:var(--mut);font-size:10px}
.pin.pw{background:color-mix(in srgb,var(--hw) 14%,var(--bg))}
.pin.gd{background:color-mix(in srgb,var(--mut) 20%,var(--bg))}
.pin.cl{color:#fff;border-color:transparent}
.pin.cl small{color:#fff}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:88vw;text-align:center}
#toast.show{opacity:1}
.item{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0;font-size:13px;line-height:1.4}
.item .t b{display:block;font-size:14px;font-weight:600}
.item .t span{display:block;color:var(--mut);font-size:12px;margin-top:2px;line-height:1.4}
.bdg{font-size:11px;padding:2px 7px;border-radius:6px;white-space:nowrap;border:1px solid var(--line);color:var(--mut)}
.bdg.ok{color:var(--ok);border-color:var(--ok)}
.bdg.me{color:var(--data);border-color:var(--data)}
.bdg.sg{color:var(--view);border-color:var(--view)}
.crow{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;margin:0 0 8px}
.crow b{display:block;font-size:14px}
.crow span{display:block;font-size:12px;color:var(--mut);margin-top:2px;line-height:1.4}
.crow span.msg-ok{color:var(--ok)}.crow span.msg-bad{color:var(--bad)}
.dprev{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:4px;image-rendering:pixelated;background:#fff;margin:2px 0 6px;cursor:pointer}
#main{flex:1;display:flex;min-height:0;position:relative}
#vp{min-width:0}
#con{display:none;flex-direction:column;width:460px;max-width:100%;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
#con.open{display:flex}
#conHead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
#conBody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#conTabs{padding:0 12px 8px;max-height:42%;overflow:auto;border-bottom:1px solid var(--line)}
#conPane{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 12px;overflow:hidden}
#conPane pre.code{flex:1;min-height:0;overflow:auto;margin:0}
@media (max-width:820px){#con{position:absolute;right:0;top:0;bottom:0;width:min(100%,460px);z-index:40;box-shadow:-4px 0 16px rgba(0,0,0,.18)}}
select.sm{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;font-size:14px}
</style>
</head>
<body>
<div id="top">
  <select id="projSel" aria-label="Project"></select>
  <button id="btnUndo" class="ib" aria-label="Undo">&#8630;</button>
  <button id="btnRedo" class="ib" aria-label="Redo">&#8631;</button>
  <button id="btnCon" class="ib" aria-label="Console" style="font-size:14px;font-family:var(--mono)">&gt;_</button>
  <button id="btnMenu" class="ib" aria-label="Project menu">&#8943;</button>
</div>
<div id="main"><div id="vp">
  <div id="world"><svg id="wires"></svg><svg id="wtmp"><path id="tmpw" class="tmp" d=""/></svg></div>
  <canvas id="mini" width="192" height="128"></canvas>
</div>
<aside id="con"><div id="conHead"><b>Console</b><button id="conClose" class="btn sm">Close</button></div><div id="conBody"></div></aside>
</div>
<div id="selbar"></div>
<div id="bar">
  <button id="btnAdd" class="btn pri">+ Add</button>
  <button id="btnFit" class="btn">Fit</button>
  <span id="hint">Drag a header to move. Drag from a dot to wire. Pinch to zoom.</span>
</div>
<div id="back"></div>
<div id="sheet" role="dialog" aria-modal="true"><div id="shHead"><b id="shTitle"></b><button id="shClose" class="btn sm">Close</button></div><div id="shBody"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
(function(){

var S=null,P=null,NM={},INW={},EL={},cache={},visiting={},sel=null,hist=[],hi=-1,SH=null,saveT=null,commitT=null;

  var e=document.createElement(tag);
  if(a)for(var k in a){var v=a[k];
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k==='value')e.value=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  (kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c)});
  return e;
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},2600)}
function fmt(v){
  if(v===undefined||v===null)return '-';
  if(typeof v==='number'){if(!isFinite(v))return String(v);return String(Math.round(v*1000)/1000)}
  if(typeof v==='boolean')return v?'true':'false';
  if(typeof v==='string')return v.length>40?v.slice(0,40)+'...':v;
  try{return JSON.stringify(v)}catch(e){return String(v)}
}
function slug(s){return String(s||'project').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'project'}
function download(name,text,mime){
  var b=new Blob([text],{type:mime||'text/plain'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();

}

  else toast('Copy blocked here. Use Download instead.');
}

var PINS='3V3,5V,2,5V,3,GND,4,14,GND,15,17,18,27,GND,22,23,3V3,24,10,GND,9,25,11,8,GND,7,0,1,5,GND,6,12,13,GND,19,16,26,20,GND,21'.split(',');

  pi5:{title:'Pi 5',pi:true,short:'Pi 5',specs:['Quad-core Cortex-A76, 2.4 GHz, 4 to 16 GB RAM','40-pin header, 3.3 V logic','SPI, I2C, UART, PWM','Header GPIO goes through gpiod / lgpio (classic RPi.GPIO does not work)','PCIe, Wi-Fi 5, Bluetooth 5']},
  esp:{title:'ESP32-S3 round LCD',pi:false,short:'ESP32-S3',specs:['Dual-core ESP32-S3, Wi-Fi, Bluetooth 5 LE','1.28 in round touch LCD','6-axis motion sensor','Firmware: Arduino, ESP-IDF or MicroPython','Add-ons wire to free GPIO (no HAT header)']}
};

var IFACE_CMD={I2C:['sudo raspi-config nonint do_i2c 0'],SPI:['sudo raspi-config nonint do_spi 0'],UART:['sudo raspi-config nonint do_serial_hw 0','sudo raspi-config nonint do_serial_cons 1']};
var CAP={zero2:{mipi:1},pi5:{mipi:2},esp:{}};
var COMMON_CAM_LIBS=[
  {id:'rpicam',name:'rpicam-apps',what:'Command-line capture: rpicam-hello, rpicam-still, rpicam-vid, rpicam-jpeg, rpicam-raw',lang:'Shell',pm:'bundled',note:'Preinstalled on Raspberry Pi OS',ok:1,def:1},
  {id:'p2',name:'Picamera2',what:'Control the camera from Python',lang:'Python',pm:'apt',pkg:'python3-picamera2',note:'Preinstalled on most images, but not on Lite',ok:1,def:1},

var LIB_PIL={id:'pil',name:'Pillow',what:'Draw text and shapes into an image',lang:'Python',pm:'apt',pkg:'python3-pil',ok:1,def:1};
var LIB_FONT={id:'font',name:'DejaVu fonts',what:'Fonts used by the generated scripts',lang:'System',pm:'apt',pkg:'fonts-dejavu-core',ok:0,def:1};
var ADDONS={
  eink:{title:'E-ink 2.13 V4',short:'E-ink',cat:'disp',desc:'250 x 122 black and white e-paper HAT. The image stays with no power.',ifaces:['SPI'],hosts:['zero2','pi5','esp'],why:{},layout:{w:250,h:122,mono:true},
    claims:[{g:8,r:'CS'},{g:10,r:'MOSI',sh:1},{g:11,r:'SCLK',sh:1},{g:25,r:'DC'},{g:17,r:'RST'},{g:24,r:'BUSY'}],

      LIB_PIL,
      {id:'numpy',name:'NumPy',what:'Required by the Waveshare examples',lang:'Python',pm:'apt',pkg:'python3-numpy',ok:1,def:1},
      {id:'spidev',name:'spidev',what:'SPI access from Python',lang:'Python',pm:'apt',pkg:'python3-spidev',ok:0,def:1},
      {id:'gpiozero',name:'gpiozero',what:'GPIO access, optional in the Waveshare guide',lang:'Python',pm:'apt',pkg:'python3-gpiozero',ok:1,def:1}],
    recipes:['Status board','Show the last photo','Name badge','Low-power sensor readout'],
    recs:[{part:'p_bme280',why:'Readings stay on the panel between updates'},{part:'ps',why:'E-ink only uses power when it refreshes, which stretches battery life'}]},
  lcd:{title:'LCD 1.44 HAT',short:'LCD',cat:'disp',desc:'128 x 128 color LCD HAT (ST7735S) with a joystick and three keys.',ifaces:['SPI'],hosts:['zero2','pi5'],why:{esp:'Needs a Pi 40-pin header'},layout:{w:128,h:128,mono:false},
    claims:[{g:8,r:'CS'},{g:10,r:'MOSI',sh:1},{g:11,r:'SCLK',sh:1},{g:25,r:'DC'},{g:27,r:'RST'},{g:24,r:'BL'},{g:6,r:'Up'},{g:19,r:'Down'},{g:5,r:'Left'},{g:26,r:'Right'},{g:13,r:'Press'},{g:21,r:'Key1'},{g:20,r:'Key2'},{g:16,r:'Key3'}],
    needs:[{t:'Enable SPI',ok:1},{t:'Joystick and keys use GPIO 5, 6, 13, 16, 19, 20, 21 and 26',ok:1},{t:'The backlight uses GPIO 24, the same pin the e-ink HAT uses for BUSY',ok:1},{t:'On Bookworm the Waveshare demo runs directly. No library install',ok:1}],
    libs:[{id:'wslcd',name:'Waveshare 1.44inch LCD HAT demo',what:'Demo code and the LCD driver module',lang:'Python',pm:'manual',lines:['sudo apt install -y p7zip-full','wget https://files.waveshare.com/upload/f/fa/1.44inch-LCD-HAT-Code.7z','7z x 1.44inch-LCD-HAT-Code.7z'],ok:1,def:1},
      LIB_PIL,
      {id:'numpy',name:'NumPy',what:'Required by the Waveshare demo',lang:'Python',pm:'apt',pkg:'python3-numpy',ok:1,def:1},

  var others=mountedOn(hn.id,a),cap=CAP[hn.type]||{};

  if(!hn||!HOSTS[hn.type]||!HOSTS[hn.type].pi)return o;
  HOST_ACTS.forEach(function(a){o.push({v:hn.id+':'+a.id,t:HOSTS[hn.type].short+': '+a.label,a:a,own:hn})});
  mountedOn(hn.id).forEach(function(p){(ACT_DEFS[p.type]||[]).forEach(function(a){o.push({v:p.id+':'+a.id,t:ADDONS[p.type].short+': '+a.label,a:a,own:p})})});
  P.nodes.forEach(function(p){if(p.type==='photolib'&&p.props.host===hn.id)ACT_DEFS.photolib.forEach(function(a){o.push({v:p.id+':'+a.id,t:'Library: '+a.label,a:a,own:p})})});
  return o;
}
function actionTarget(n){
  var hn=NM[n.props.host];if(!hn||!isHost(hn))return null;
  return actionOptions(hn).filter(function(x){return x.v===n.props.target})[0]||null;
}
def('action',{cat:'logic',title:'Action',desc:'Does something on a part when triggered.',w:230,
  ins:[{n:'trigger',t:'bool',d:false}],outs:[{n:'fired',t:'num'},{n:'ready',t:'bool'}],
  props:function(){return{host:null,target:'',arg:'',mode:'press'}},
  ev:function(n,i){
    var t=!!i[0];
    if(t&&!n.rt.prev){n.rt.fired=(n.rt.fired||0)+1;simFire(n);setTimeout(function(){refresh()},0)}
    n.rt.prev=t;
    return[n.rt.fired||0,!!actionTarget(n)];
  },
  body:function(n,b){
    b.appendChild(lab('On'));n.rt.hs=h('select');b.appendChild(n.rt.hs);
    n.rt.hs.addEventListener('change',function(){n.props.host=n.rt.hs.value===''?null:parseInt(n.rt.hs.value,10);n.props.target='';touch(n)});
    b.appendChild(lab('Do'));n.rt.ts=h('select');b.appendChild(n.rt.ts);
    n.rt.ts.addEventListener('change',function(){n.props.target=n.rt.ts.value;touch(n)});
    n.rt.ai=h('input',{type:'text',placeholder:'value'});b.appendChild(n.rt.ai);
    n.rt.ai.addEventListener('input',function(){n.props.arg=n.rt.ai.value;changed()});
    n.rt.msl=lab('Fires when');b.appendChild(n.rt.msl);n.rt.ms=h('select');
    [['press','Trigger turns on'],['release','Trigger turns off'],['hold','Held for 1 second'],['hold3','Held for 3 seconds']].forEach(function(x){n.rt.ms.appendChild(h('option',{value:x[0],text:x[1]}))});
    n.rt.ms.value=n.props.mode;n.rt.ms.addEventListener('change',function(){n.props.mode=n.rt.ms.value;changed()});
    b.appendChild(n.rt.ms);
    n.rt.msg=h('div',{class:'lbl'});b.appendChild(n.rt.msg);
    b.appendChild(h('div',{class:'flex'},[h('button',{class:'btn sm',text:'Test fire',onclick:function(){n.rt.fired=(n.rt.fired||0)+1;simFire(n);refresh()}}),h('button',{class:'btn sm',text:'Controls script',onclick:openControls})]));
  },
  upd:function(n){
    var hosts=P.nodes.filter(function(x){return isHost(x)&&HOSTS[x.type].pi});
    if(n.props.host==null||!NM[n.props.host]){if(hosts.length&&n.props.host==null)n.props.host=hosts[0].id}
    var hn=NM[n.props.host],opts=actionOptions(hn);
    var sig=JSON.stringify([hosts.map(function(x){return x.id}),n.props.host,opts.map(function(o){return o.v}),n.props.target]);
    if(n.rt.sig!==sig){
      n.rt.sig=sig;n.rt.hs.innerHTML='';
      n.rt.hs.appendChild(h('option',{value:'',text:hosts.length?'Choose a Pi':'Add a Pi first'}));
      hosts.forEach(function(x){n.rt.hs.appendChild(h('option',{value:String(x.id),text:HOSTS[x.type].title+' #'+x.id}))});
      n.rt.hs.value=n.props.host==null?'':String(n.props.host);
      n.rt.ts.innerHTML='';
      n.rt.ts.appendChild(h('option',{value:'',text:opts.length?'Choose an action':'Nothing to do yet'}));
      var stale=n.props.target&&!opts.some(function(o){return o.v===n.props.target});
      if(stale)n.rt.ts.appendChild(h('option',{value:n.props.target,text:'(no longer available)'}));
      opts.forEach(function(o){n.rt.ts.appendChild(h('option',{value:o.v,text:o.t}))});
      n.rt.ts.value=n.props.target||'';
    }
    var tg=actionTarget(n);
    n.rt.ai.style.display=tg&&tg.a.arg?'':'none';
    n.rt.ai.placeholder=tg&&tg.a.arg||'';
    if(document.activeElement!==n.rt.ai)n.rt.ai.value=n.props.arg||'';
    var bad=n.props.target&&!tg;
    n.rt.msg.className='lbl '+(bad?'msg-bad':'');
    var w0=INW[n.id+':0'],up=w0&&NM[w0.from.n],chained=!!(up&&up.type==='action');
    n.rt.ms.style.display=chained?'none':'';n.rt.msl.style.display=chained?'none':'';
    n.rt.msg.textContent=chained?'Runs right after '+((actionTarget(up)||{a:{label:'the previous'}}).a.label.toLowerCase())+' (same key press)':bad?'That part is no longer mounted on this Pi':'Fired '+(n.rt.fired||0)+' time'+((n.rt.fired||0)===1?'':'s')+(n.rt.mock?'. Mock photo #'+n.rt.mock+' taken in the preview':'');
    EL[n.id].sub.textContent=tg?tg.a.label:'';
  }});

function partsOn(hn){return mountedOn(hn.id)}
function hasAct(owner,id){return P.nodes.some(function(n){return n.type==='action'&&n.props.target===owner.id+':'+id})}
function freeOut(src,prefer){
  var names=TY[src.type].outs.map(function(o){return o.n}),order=prefer||names;
  for(var i=0;i<order.length;i++){
    var p=names.indexOf(order[i]);if(p<0)continue;
    if(!P.wires.some(function(w){return w.from.n===src.id&&w.from.p===p}))return p;
  }
  return -1;
}
function mkAction(hn,owner,actId,src,mode){
  var cnt=P.nodes.filter(function(n){return n.type==='action'}).length;
  var n=addNode('action');
  n.props.host=hn.id;n.props.target=owner.id+':'+actId;n.props.mode=mode||'press';
  var near=src?src.n:hn;
  n.x=Math.round(near.x+near.w+100);n.y=Math.round(near.y+cnt*200);
  var r=EL[n.id].root;r.style.left=n.x+'px';r.style.top=n.y+'px';
  if(src)P.wires.push({id:uid(),from:{n:src.n.id,p:src.p},to:{n:n.id,p:0}});
  refresh();drawWires();commitNow();drawMini();
  return n;
}
function addFrameToScreen(sc){
  var c=dcfg(sc),d=sc.props.dsp;
  d.els.push({t:'img',x:Math.round(c.w*0.45),y:Math.round(c.h*0.1),w:Math.round(c.w*0.5),h:Math.round(c.h*0.8),src:P.nodes.some(function(n){return n.type==='photolib'})?'library':'last',c:c.mono?'#000000':'#ffffff'});
  d.sel=d.els.length-1;refresh();commitNow();
}
function showValueOnScreen(sc,srcNode,port,label){
  var T=TY[sc.type],k=-1;
  for(var i=0;i<T.ins.length;i++){if(!P.wires.some(function(w){return w.to.n===sc.id&&w.to.p===i})){k=i;break}}
  if(k<0){toast('All inputs on that screen are in use');return false}
  P.wires.push({id:uid(),from:{n:srcNode.id,p:port},to:{n:sc.id,p:k}});
  var d=sc.props.dsp,c=dcfg(sc),used=d.els.filter(function(e){return e.t==='text'}).length;
  d.els.push({t:'text',x:4,y:Math.min(c.h-14,4+used*(c.mono?14:16)),s:c.mono?12:12,b:0,v:label+' {in'+(k+1)+'}',c:c.mono?'#000000':'#ffffff'});
  refresh();drawWires();commitNow();return true;
}
function ideas(){
  var out=[];
  P.nodes.filter(function(x){return isHost(x)&&HOSTS[x.type].pi}).forEach(function(hn){
    var parts=partsOn(hn);
    var cams=parts.filter(function(p){return ADDONS[p.type].cat==='cam'}),
      picam=cams.filter(function(p){return /^p_(cam|hq)/.test(p.type)})[0],
      scr=parts.filter(function(p){return ACT_DEFS[p.type]&&ACT_DEFS[p.type].some(function(a){return a.id==='show'})}),
      lcd=parts.filter(function(p){return p.type==='lcd'})[0],
      btns=parts.filter(function(p){return p.type==='p_button'}),
      pir=parts.filter(function(p){return p.type==='p_pir'})[0],
      ps=parts.filter(function(p){return p.type==='ps'})[0],
      sens=parts.filter(function(p){return ADDONS[p.type].cat==='sens'&&ADDONS[p.type].outs.length&&p.type!=='p_pir'});
    function keyFor(prefer){
      if(lcd){var q=freeOut(lcd,prefer);if(q>=0)return{n:lcd,p:q}}
      for(var i=0;i<btns.length;i++){var r=freeOut(btns[i],['pressed']);if(r>=0)return{n:btns[i],p:r}}
      return null;
    }
    var cam=picam||cams[0];
    if(cam&&!scr.length){
      out.push({title:'Add a screen to see your photos',why:'You have a camera but nothing to show its pictures on. Pick one and its libraries and layout tools come with it.',
        btns:[['LCD HAT (color, with buttons)','lcd'],['OLED','p_ssd1306'],['E-ink','eink']].map(function(x){return [x[0],function(){addPartNode(x[1],hn)}]})});
    }
    if(cam&&!lcd&&!btns.length){
      out.push({title:'Add buttons to control the '+ADDONS[cam.type].short,why:'The LCD HAT has a joystick and three keys. A single push button works too.',
        btns:[['Add LCD HAT',function(){addPartNode('lcd',hn)}],['Add push button',function(){addPartNode('p_button',hn)}]]});
    }
    if(picam&&!hasAct(picam,'photo')){
      var k1=keyFor(['press','key1','key2','key3']);
      if(k1)out.push({title:'Take a photo with a button',why:'Wires a key to a Take photo action.',btns:[['Add it',function(){mkAction(hn,picam,'photo',k1,'press')}]]});
    }
    if(picam&&scr.length&&hasAct(picam,'photo')&&!hasAct(scr[0],'show')){
      var k2=keyFor(['key1','key2','key3','press','up','down']);
      if(k2)out.push({title:'Show the last photo on the '+ADDONS[scr[0].type].short,why:'Adds a Show last photo action on another key. Press one key to shoot and the other to look.',btns:[['Add it',function(){mkAction(hn,scr[0],'show',k2,'press')}]]});
    }
    if(cam&&scr.length&&!scr[0].props.dsp.els.some(function(e){return e.t==='img'})){
      out.push({title:'Put the camera frame in the '+ADDONS[scr[0].type].short+' layout',why:'Adds a photo area to the screen layout. You can move and resize it, and choose between the last photo and a live frame.',btns:[['Add it',function(){addFrameToScreen(scr[0])}]]});
    }
    if(picam&&hasAct(picam,'photo')&&!hasAct(picam,'video')){
      var k3=keyFor(['key3','key2','key1','press']);
      if(k3)out.push({title:'Record video with another key',why:'One press starts recording, the next press stops it.',btns:[['Add it',function(){mkAction(hn,picam,'video',k3,'press')}]]});
    }
    if(picam&&pir&&!P.wires.some(function(w){return w.from.n===pir.id})){
      out.push({title:'Take a photo when motion is seen',why:'Wires the PIR sensor to the camera.',btns:[['Add it',function(){mkAction(hn,picam,'photo',{n:pir,p:0},'press')}]]});
    }
    if(cam&&!pir)out.push({title:'Add a motion sensor',why:'A PIR sensor can trigger the camera on its own.',btns:[['Add PIR',function(){addPartNode('p_pir',hn)}]]});
    if(scr.length&&ps&&!P.wires.some(function(w){return w.from.n===ps.id&&w.to.n===scr[0].id})){
      out.push({title:'Show the battery level on the '+ADDONS[scr[0].type].short,why:'Wires the PiSugar battery to a text line on the screen.',btns:[['Add it',function(){showValueOnScreen(scr[0],ps,0,'batt')}]]});
    }
    if(scr.length)sens.forEach(function(s){
      if(P.wires.some(function(w){return w.from.n===s.id&&w.to.n===scr[0].id}))return;
      out.push({title:'Show '+ADDONS[s.type].short+' readings on the '+ADDONS[scr[0].type].short,why:'Wires '+ADDONS[s.type].outs[0].n+' to a text line.',btns:[['Add it',function(){showValueOnScreen(scr[0],s,0,ADDONS[s.type].outs[0].n.split(' ')[0])}]]});
    });
    if(!P.nodes.some(function(n){return n.type==='action'&&n.props.target===hn.id+':shutdown'})){
      var k4=keyFor(['key3','key2','key1']);
      if(k4)out.push({title:'Hold a key to shut down safely',why:'Holding for a second shuts the Pi down so the SD card is not corrupted by cutting power.',btns:[['Add it',function(){mkAction(hn,hn,'shutdown',k4,'hold')}]]});
    }
    var lib=libFor(hn);
    if(picam&&scr.length&&hasAct(picam,'photo')&&!lib){
      out.push({title:'Keep and browse your photos',why:'Adds a Photo library that numbers every photo and remembers which one you are viewing. Then Next and Previous keys can cycle through them.',
        btns:[['Add it',function(){
          var L=addNode('photolib');L.props.host=hn.id;L.x=hn.x+hn.w+60;L.y=hn.y+420;EL[L.id].root.style.left=L.x+'px';EL[L.id].root.style.top=L.y+'px';
          var kn=keyFor(['right','key2']),kp=keyFor(['left','key3']);
          if(kn)mkAction(hn,L,'next',kn,'press');
          kp=keyFor(['left','key3']);if(kp)mkAction(hn,L,'prev',kp,'press');
          refresh();drawWires();commitNow();}]]});
    }
    if(lib&&scr.length&&!P.wires.some(function(w){return w.from.n===lib.id&&w.to.n===scr[0].id})){
      out.push({title:'Show the photo number on the '+ADDONS[scr[0].type].short,why:'Wires the library to a line like "photo 3 / 12" on the screen.',
        btns:[['Add it',function(){
          if(showValueOnScreen(scr[0],lib,1,'photo')){var d=scr[0].props.dsp,last=d.els[d.els.length-1];var k=parseInt(last.v.match(/\{in(\d)\}/)[1],10);
            var T=TY[scr[0].type],k2=-1;for(var i=0;i<T.ins.length;i++){if(!P.wires.some(function(w){return w.to.n===scr[0].id&&w.to.p===i})){k2=i;break}}
            if(k2>=0){wireUp(lib,0,scr[0],k2);last.v='photo {in'+k+'} / {in'+(k2+1)+'}';refresh();commitNow()}}}]]});
    }
    if(lib&&!hasAct(lib,'delete')){
      var kd=keyFor(['down','up','key3']);
      if(kd)out.push({title:'Hold a key to delete the current photo',why:'Needs a 3 second hold so you do not delete one by accident.',btns:[['Add it',function(){mkAction(hn,lib,'delete',kd,'hold3')}]]});
    }
    if(parts.some(function(p){return ADDONS[p.type].layout})&&!parts.some(function(p){return p.props.dsp&&p.props.dsp.els.some(function(e){return e.t==='icon'})})){
      var sc2=parts.filter(function(p){return ADDONS[p.type].layout})[0];
      out.push({title:'Add an icon to the '+ADDONS[sc2.type].short+' layout',why:'Icons like battery, wifi, camera and heart can show up on the screen, and each can appear only when a value is on.',btns:[['Add a battery icon',function(){addIconToScreen(sc2,'battery')}]]});
    }
  });
  return out;
}

var SVGNS='http://www.w3.org/2000/svg';
var OKT={g:1,path:1,circle:1,ellipse:1,rect:1,line:1,polyline:1,polygon:1,text:1,tspan:1};
var OKA=/^(x|y|x1|x2|y1|y2|cx|cy|r|rx|ry|d|points|width|height|fill|stroke|stroke-width|stroke-linecap|stroke-linejoin|stroke-dasharray|opacity|fill-opacity|stroke-opacity|transform|font-size|text-anchor|font-family|font-weight|dx|dy)$/;
function cleanSvg(str){
  var doc=new DOMParser().parseFromString('<svg xmlns="'+SVGNS+'">'+str+'</svg>','image/svg+xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('Invalid SVG');
  var holder=document.createElementNS(SVGNS,'g');
  (function walk(src,dst){
    Array.prototype.forEach.call(src.childNodes,function(c){
      if(c.nodeType===3){dst.appendChild(document.createTextNode(c.nodeValue));return}
      if(c.nodeType!==1||!OKT[c.localName])return;
      var e=document.createElementNS(SVGNS,c.localName);
      Array.prototype.forEach.call(c.attributes,function(a){if(OKA.test(a.name))e.setAttribute(a.name,a.value)});
      walk(c,e);dst.appendChild(e);
    });
  })(doc.documentElement,holder);
  return holder;
}

function badgeEl(ok){
  var m={1:['ok','Checked against docs'],0:['me','From memory'],2:['sg','Suggestion'],3:['','Catalog note']};
  var x=m[ok===undefined?0:ok]||m[0];
  return h('span',{class:'bdg'+(x[0]?' '+x[0]:''),text:x[1]});
}
function libOn(n,l){
  var o=n&&n.props&&n.props.libs;
  if(o&&o[l.id]!==undefined)return !!o[l.id];
  return !!l.def;
}
function setupLines(items){
  var ifs=[],apt=[],pip=[],git=[],man=[],out=[],blinka=false,pi5=false,esp=false,any=false;
  function add(a,v){if(v&&a.indexOf(v)<0)a.push(v)}
  items.forEach(function(it){
    if(it.host==='esp'){esp=true;return}
    any=true;if(it.host==='pi5')pi5=true;
    (it.A.ifaces||[]).forEach(function(f){(IFACE_CMD[f]||[]).forEach(function(c){add(ifs,c)})});
    (it.A.libs||[]).forEach(function(l){
      if(!it.on(l))return;
      if(l.blinka)blinka=true;
      if(l.pm==='apt')String(l.pkg).split(' ').forEach(function(p){add(apt,p)});
      else if(l.pm==='pip')add(pip,l.pkg);
      else if(l.pm==='git')add(git,l.pkg);
      else if(l.pm==='manual')(l.lines||[]).forEach(function(x){add(man,x)});
    });
  });
  if(esp&&!any)return ['# ESP32-S3 add-ons are wired to free GPIO and run as firmware. Nothing to install on a Pi.'];
  if(pi5&&blinka){add(apt,'python3-rpi-lgpio')}
  ifs.forEach(function(c){out.push(c)});
  if(apt.length){out.push('sudo apt update');out.push('sudo apt install -y '+apt.join(' '))}
  if(pi5&&blinka)out.push('# Pi 5: if RPi.GPIO is installed, remove it first (sudo apt remove -y python3-rpi.gpio). python3-rpi-lgpio replaces it');
  if(pip.length){
    out.push('python3 -m venv --system-site-packages ~/sandbox-env');
    out.push('source ~/sandbox-env/bin/activate');
    out.push('pip install '+pip.join(' '));
  }
  git.forEach(function(u){out.push('git clone '+u)});
  man.forEach(function(x){out.push(x)});
  if(esp)out.push('# ESP32-S3 add-ons are wired to free GPIO and need firmware libraries, not Pi packages.');
  if(!out.length)out.push('# Nothing to install for the current choices.');
  return out;
}
